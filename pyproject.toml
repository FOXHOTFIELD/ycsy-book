[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ycsy-book"
version = "0.1.17"
description = "Unofficial CLI/TUI for booking remote-lab experiment benches"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ycsy-book contributors" }]
keywords = ["lab", "booking", "cli", "tui"]
dependencies = [
    "requests>=2.28",
    "platformdirs>=3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
ycsy = "ycsy.cli:main"

[project.urls]
Homepage = "https://github.com/FOXHOTFIELD/ycsy-book"
Repository = "https://github.com/FOXHOTFIELD/ycsy-book"
Issues = "https://github.com/FOXHOTFIELD/ycsy-book/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

# Pin the rule set on purpose: newer ruff releases keep widening their defaults,
# which turned a green build red without a single code change. These cover real
# errors; the style families (UP/BLE/S/PLW) are judgement calls we skip.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
